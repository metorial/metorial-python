name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: |
          if [ -d tests ]; then
            uv run ruff check src/metorial/ tests/
          else
            uv run ruff check src/metorial/
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run ruff format --check src/metorial/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run mypy src/metorial/

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        mcp: ["mcp>=2,<3", "mcp>=1.21,<2"]
        include:
          # Oldest supported mcp. Its bundled FastMCP test server needs a
          # pydantic from the same era.
          - python-version: "3.10"
            mcp: "mcp==1.21.0"
            extra: "pydantic<2.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --python ${{ matrix.python-version }}
      - run: uv pip install "${{ matrix.mcp }}" ${{ matrix.extra && format('"{0}"', matrix.extra) || '' }}
      - run: uv run --no-sync python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - run: uv run --no-sync pytest -q

  type-check-mcp-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv pip install "mcp>=1.21,<2"
      - run: uv run --no-sync mypy src/metorial/
